[package]
name = "collections"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Intrusive singly linked lists, lists, simple queues, tail queues and a red-black tree"
repository.workspace = true
publish = false

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "shapes"
harness = false

[[bench]]
name = "rb_tree"
harness = false

[lib]
# Tests reproduce bugs as integration tests.
test = false
doctest = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
unused_results = "deny"
unused_import_braces = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
variant_size_differences = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"  # the restriction group is denied on purpose; conflicting lints are allowed one by one
implicit_return = "allow"  # conflicts with needless_return
semicolon_inside_block = "allow"  # conflicts with semicolon_outside_block
mod_module_files = "allow"  # conflicts with self_named_module_files; each shape uses mod.rs
definition_in_module_root = "allow"  # each shape defines its types in its mod.rs
missing_trait_methods = "allow"  # traits provide default methods so implementations can omit them
arbitrary_source_item_ordering = "allow"  # items follow their API relationships, not the alphabet
question_mark_used = "allow"  # ? is the idiomatic early return
pub_use = "allow"  # modules re-export their public API
single_call_fn = "allow"
inline_modules = "allow"
undocumented_unsafe_blocks = "allow"  # an unsafe fn's contract covers its blocks
multiple_unsafe_ops_per_block = "allow"  # operations sharing one precondition share one block
missing_docs_in_private_items = "allow"  # private items are documented only for what the code cannot say
redundant_pub_crate = "allow"  # conflicts with rustc's unreachable_pub
pub_with_shorthand = "allow"  # conflicts with pub_without_shorthand; use pub(crate)
