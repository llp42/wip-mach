[package]
name = "collections"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"
description = "Intrusive singly linked lists, lists, simple queues and tail queues"
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "shapes"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
unused_results = "deny"
unused_import_braces = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
variant_size_differences = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
# The restriction group is meant to be picked from, not enabled whole; the
# lints below contradict another lint, the idiom of the language, or the
# repository's comment rules (AGENTS.md), and are the only ones allowed.
blanket_clippy_restriction_lints = "allow"
# Contradicts `needless_return`.
implicit_return = "allow"
# Contradicts `semicolon_outside_block`, which this crate follows.
semicolon_inside_block = "allow"
# Contradicts `self_named_module_files`; every shape is a `mod.rs` folder.
mod_module_files = "allow"
# Would demand every provided method of `Iterator`, `Default`, ...
missing_trait_methods = "allow"
# Items are ordered for the reader: head, then operations, then helpers.
arbitrary_source_item_ordering = "allow"
# `?` is the idiom for early exits on `Option`.
question_mark_used = "allow"
# The API is built from per-module re-exports (adapter macro, cursors).
pub_use = "allow"
# Named helpers read better than inlined bodies, even when called once.
single_call_fn = "allow"
# `#[cfg(test)] mod tests` sits beside the code it tests.
inline_modules = "allow"
# AGENTS.md: an `unsafe {}` inside an `unsafe fn` takes no comment, and a
# comment covers the one precondition a block's operations share.
undocumented_unsafe_blocks = "allow"
multiple_unsafe_ops_per_block = "allow"
# AGENTS.md: document what the code does not say; no doc that respells a
# private name.
missing_docs_in_private_items = "allow"
# Contradicts rustc's `unreachable_pub`, which this crate follows.
redundant_pub_crate = "allow"
# Contradicts `pub_without_shorthand`; `pub(crate)` is the common form.
pub_with_shorthand = "allow"
