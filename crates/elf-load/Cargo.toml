[package]
name = "elf-load"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Parse ELF executables: recognize an image and report its segments"
repository.workspace = true
publish = false

[lib]
# Tests reproduce bugs as integration tests.
test = false
doctest = false

[dependencies]
bitflags.workspace = true
elf.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_results = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_safety_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
allow_attributes = "deny"
struct_field_names = "allow"  # fields follow the ELF header's e_* and p_* names
redundant_pub_crate = "allow"  # conflicts with rustc's unreachable_pub
