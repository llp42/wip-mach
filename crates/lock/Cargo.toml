[package]
name = "lock"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"
description = "Spin locks, a handoff mutex, a fair reader-writer lock and condition variables, free of spl"
repository.workspace = true
publish = false

[dependencies]
collections = { path = "../collections" }

[target.'cfg(loom)'.dependencies]
loom = { version = "=0.7.2", default-features = false }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "spin"
harness = false

[[bench]]
name = "mutex"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_results = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_safety_doc = "deny"
# Contradicts rustc's `unreachable_pub`, which this crate follows.
redundant_pub_crate = "allow"
