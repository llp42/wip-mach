[workspace]
members = ["crates/*"]
default-members = ["crates/mach"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Leonardo Lopes Pereira <leonardolopespereira@outlook.com>"]
license = "GPL-2.0-or-later"
repository = "https://github.com/llp42/wip-mach"

[workspace.dependencies]
acpi = { path = "crates/acpi" }
bitfield = { version = "=0.19.5", default-features = false }
bitflags = { version = "=2.13.2", default-features = false }
clock = { path = "crates/clock" }
collections = { path = "crates/collections" }
kmem = { path = "crates/kmem" }
lock = { path = "crates/lock" }
mach-fake = { path = "crates/mach-fake" }
mach-boot = { path = "crates/mach-boot" }
mach-device = { path = "crates/mach-device" }
mach-emulation = { path = "crates/mach-emulation" }
mach-gsync = { path = "crates/mach-gsync" }
mach-host = { path = "crates/mach-host" }
mach-ipc = { path = "crates/mach-ipc" }
mach-kd = { path = "crates/mach-kd" }
mach-page = { path = "crates/mach-page" }
mach-sched = { path = "crates/mach-sched" }
mach-slab = { path = "crates/mach-slab" }
mach-pmap = { path = "crates/mach-pmap" }
mach-task = { path = "crates/mach-task" }
mach-thread = { path = "crates/mach-thread" }
mach-trap = { path = "crates/mach-trap" }
mach-tty = { path = "crates/mach-tty" }
mach-vm = { path = "crates/mach-vm" }
elf = { version = "=0.8.0", default-features = false }
itoa = { version = "=1.0.18", default-features = false }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
libc = { version = "=0.2.189", default-features = false }
lock_api = { version = "=0.4.14", default-features = false }
oem_cp = { version = "=2.1.2", default-features = false }
raw-cpuid = { version = "=11.6.0", default-features = false }
volatile = { version = "=0.6.1", default-features = false }
vte = { version = "=0.15.0", default-features = false }
x86_64 = { git = "https://github.com/llp42/x86_64", rev = "cf35416112fe9fa2c59b18974f56b8fcd0c69090", default-features = false, features = ["instructions"] }
zerocopy = { version = "=0.8.62", default-features = false, features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_safety_doc = "deny"

[profile.dev]
opt-level = 2
debug = "line-tables-only"
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[profile.bench]
lto = false
