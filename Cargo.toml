[workspace]
members = ["crates/*"]
exclude = ["crates/.mimocode"]
default-members = ["crates/kernel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Leonardo Lopes Pereira <leonardolopespereira@outlook.com>"]
license = "GPL-2.0-or-later"
repository = "https://github.com/llp42/wip-mach"

# The everyday build.  Debug assertions and overflow checks are on, so a
# `debug_assert!` runs in a booted kernel and in host tests alike (ADR 0022).
[profile.dev]
opt-level = 2
# Line tables only: full DWARF weighs the kernel image down.
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
panic = "abort"

# What runs the Hurd, and what the benchmarks time: the checks are off.
[profile.release]
panic = "abort"
lto = true

# The benchmarks inherit `release`, whose LTO link dominates their build
# time; they compare structures relative to each other, so they skip it.
[profile.bench]
lto = false
