# rust-analyzer settings for this workspace.
#
# `.cargo/config.toml` sets `[build] target = "x86_64-unknown-none"`, which is
# right for the kernel and wrong for analysis: `cargo check --all-targets`
# then builds bench/test dev-deps (criterion -> serde_core) for a freestanding
# target. Those crates are `std` code, so the bare-metal prelude has no
# `Option`/`Some`/`None` and the editor fills with
# "cannot find value `None` in this scope".
#
# Check on the host instead. The portable crates are host-tested there
# (ADR 0024); the kernel still typechecks under `no_std`/`no_main`.
#
# Restart the rust-analyzer server after changing this file.

[cargo]
target = "x86_64-unknown-linux-gnu"
allTargets = true

[check]
allTargets = true
