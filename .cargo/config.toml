# Cargo configuration for building wip-mach as a freestanding (no_std,
# no_main) kernel for the official x86_64-unknown-none target -- prebuilt by
# upstream (Tier 2), so no custom target-spec JSON and no -Z build-std needed.
#
# The target's defaults fit the kernel: soft-float, no SSE/MMX, no red zone,
# code-model=kernel (the kernel lives in the last 2GiB, see
# VM_MIN_KERNEL_ADDRESS), panic=abort.  It defaults to a position-independent
# executable; we want a plain static binary for the kernel's `ldscript`
# high-half layout, whose `_START`, `_START_MAP` and `KERNEL_MAP_SHIFT` come
# from the --defsym arguments below.

[build]
target = "x86_64-unknown-none"

# The kernel flags stay on the kernel target: host unit-test builds of the
# workspace's portable crates link with the host toolchain and must not get
# `crates/kernel/ldscript` or the defsyms.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=-Tcrates/kernel/ldscript",
    "-C", "link-arg=--defsym=_START=0x1000000",
    "-C", "link-arg=--defsym=_START_MAP=0x1000000",
    "-C", "link-arg=--defsym=KERNEL_MAP_SHIFT=0xffffffff80000000",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
    "-C", "link-arg=-z",
    "-C", "link-arg=nostart-stop-gc",
]
