# Sourced by the image's grub.cfg after its own entries: boot the Hurd with
# the Mach console on the first serial port, so the `console` getty listens
# there, and talk to GRUB over serial too.  The modules are those of the
# pinned snapshot's own entry.
serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial
set timeout=1

menuentry 'Hurd smoke test (serial)' --id smoke {
	insmod part_msdos
	insmod ext2
	search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
	multiboot	/boot/gnumach-1.8-amd64-up.gz root=part:2:device:wd0 console=com0
	module		/hurd/pci-arbiter.static pci-arbiter \
			--host-priv-port='${host-port}' --device-master-port='${device-port}' \
			--next-task='${acpi-task}' \
			'$(pci-task=task-create)' '$(task-resume)'
	module		/hurd/acpi.static acpi \
			--next-task='${disk-task}' \
			'$(acpi-task=task-create)'
	module		/hurd/rumpdisk.static rumpdisk \
			--next-task='${fs-task}' \
			'$(disk-task=task-create)'
	module		/hurd/ext2fs.static ext2fs --readonly \
			--multiboot-command-line='${kernel-command-line}' \
			--exec-server-task='${exec-task}' -T typed '${root}' \
			'$(fs-task=task-create)'
	module		/lib/ld-x86-64.so.1 exec /hurd/exec '$(exec-task=task-create)'
}
set default=smoke
